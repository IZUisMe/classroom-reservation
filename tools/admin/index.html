<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>教室写真の追加｜管理者PC専用</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%230017c1'/%3E%3C/svg%3E"><link rel="stylesheet" href="/style.css"></head>
<body>
  <header><div class="container header"><h1>教室写真の追加</h1><span class="badge">管理者PC専用</span></div></header>
  <main class="container">
    <p class="intro">写真はこのPCのアプリ用データに保存します。公開サイトへの投稿・送信は行いません。</p>
    <div id="connection" role="status">読み込み中…</div>
    <form id="upload-form" hidden novalidate>
      <section class="panel"><div class="fields"><div class="field"><label for="room">教室</label><select id="room" required><option value="">選択してください</option></select></div><div class="field"><label for="default-kind">写真の種類</label><select id="default-kind"><option value="interior">室内</option><option value="exterior">外観</option></select></div></div><p id="room-info" class="hint"></p></section>
      <section class="panel"><h2>追加する写真</h2><label id="dropzone" class="dropzone" for="files"><strong>写真を選択</strong><span>または、ここにドラッグ＆ドロップ</span><small>JPG・PNG・WebP ／ 1枚20MBまで</small></label><input id="files" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp" multiple><p class="hint">縦横比を保ち、最大1440×1080のWebPへ変換します。位置情報等の付加情報は保存しません。</p><div id="file-errors" class="errors" role="alert" hidden></div><div id="queue" class="queue"></div><div class="actions"><span id="queue-count" role="status">0枚</span><button id="add" type="submit" disabled>追加</button></div></section>
      <section id="results-panel" class="panel" hidden><h2>追加結果</h2><p id="result-summary" role="status"></p><ul id="results"></ul><p class="hint">追加した写真を公開アプリへ反映するには、<code>pnpm build</code>を実行してください。GitHub Pagesの更新は別途行います。</p></section>
    </form>
  </main>
  <footer class="container">この管理画面は127.0.0.1:4174だけで動作します。終了は起動用ウィンドウでCtrl+C。</footer>
  <script type="module" src="/admin.js"></script>
</body>
</html>
